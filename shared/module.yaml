# The android platform only renders the @Preview composables in the IDE;
# no Android app is built from it.
product:
  type: kmp/lib
  platforms: [ jvm, android, wasmJs ]

apply:
  - //common.module-template.yaml

dependencies:
  # compose
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.compose.materialIconsExtended
  - $libs.androidx.lifecycle.viewmodel.compose: exported
  - $libs.androidx.lifecycle.runtime.compose

  # kotlinx
  - $libs.kotlinx.coroutines.core

  # the code editor
  - $libs.nemo.editor

  # settings storage
  - $libs.settings.noArg

# the tooling the IDE renders previews with
dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.ma7moud3ly.tipframe.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  android:
    namespace: com.ma7moud3ly.tipframe.shared
